name: Android piloto nativo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'data/**'
      - 'scripts/android-pilot-catalog.cjs'
      - 'scripts/android-contract-check.cjs'
      - '.github/workflows/android-pilot.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'data/**'
      - 'scripts/android-pilot-catalog.cjs'
      - 'scripts/android-contract-check.cjs'
      - '.github/workflows/android-pilot.yml'
permissions:
  contents: read
jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Preparar catálogo e SDK
        run: |
          node scripts/android-pilot-catalog.cjs
          git diff --exit-code -- android/piloto/src/main/assets/catalog.json
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar, testar domínio e verificar lint
        env:
          GABARITEI_FIXTURE_OUT: /tmp/gabaritei-contract.json
          GABARITEI_EDITS_FIXTURE_OUT: /tmp/gabaritei-edits-contract.json
        run: gradle -p android :piloto:assembleDebug :piloto:assembleRelease :piloto:testDebugUnitTest :piloto:lintDebug :piloto:assembleQaAndroidTest --console plain
      - name: Conferir contrato de dados com o site
        run: node scripts/android-contract-check.cjs /tmp/gabaritei-contract.json /tmp/gabaritei-edits-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: Gabaritei-Piloto-verificacoes
          path: |
            android/piloto/build/reports/tests/testDebugUnitTest/
            android/piloto/build/reports/lint-results-debug.html
          retention-days: 7
